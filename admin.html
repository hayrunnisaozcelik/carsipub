<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Menü Yönetimi · Çarşı Pub</title>
<meta name="theme-color" content="#0d0e12">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/css/admin.css?v=1">
<script type="module" src="assets/js/admin.js?v=2"></script>
</head>
<body>

<form class="login" id="login" hidden>
  <h1>Çarşı Pub</h1>
  <p>Menü yönetimi</p>
  <label>Şifre<input type="password" id="pass" autocomplete="current-password" required></label>
  <button class="primary" type="submit">Giriş</button>
  <p class="msg" id="login-msg" role="status"></p>
</form>

<div id="app" hidden>
  <header class="top">
    <h1>Menü</h1>
    <div class="top-actions">
      <a href="/#menu" target="_blank" rel="noopener">Siteyi gör</a>
      <button type="button" id="history-btn">Geçmiş</button>
      <button type="button" id="logout">Çıkış</button>
    </div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="editor"></main>

  <div class="savebar" id="savebar">
    <span id="save-state">Değişiklik yok</span>
    <button type="button" id="discard" hidden>Vazgeç</button>
    <button type="button" class="primary" id="save" disabled>Kaydet</button>
  </div>
</div>

<dialog id="history">
  <h2>Önceki kayıtlar</h2>
  <p class="muted">Yanlış bir şey kaydedildiyse menüyü önceki hâline döndürebilirsiniz.</p>
  <ul id="history-list"></ul>
  <button type="button" id="history-close">Kapat</button>
</dialog>

<p class="toast" id="toast" role="status"></p>
</body>
</html>
